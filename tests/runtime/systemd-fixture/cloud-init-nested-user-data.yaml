#cloud-config
ssh_pwauth: false
disable_root: true
bootcmd:
  - [sh, -c, "echo TASK11_NESTED_CLOUDINIT_BOOT > /dev/hvc0"]
  - [systemctl, mask, --now, ssh.service, ssh.socket, apt-daily.service, apt-daily-upgrade.service]
write_files:
  - path: /etc/cloud8021x-task11-fixture
    permissions: '0600'
    content: synthetic-only-v1
  - path: /etc/systemd/journald.conf.d/task11.conf
    content: |
      [Journal]
      SystemMaxUse=32M
      RuntimeMaxUse=16M
  - path: /etc/systemd/system/task11-nested-prep.service
    content: |
      [Unit]
      Description=Development-only offline nested platform canary
      After=local-fs.target systemd-udev-trigger.service
      [Service]
      Type=oneshot
      StandardOutput=journal
      StandardError=journal
      LogRateLimitIntervalSec=0
      Environment=TMPDIR=/run
      ExecStart=/bin/bash /run/task11-seed/offline-prereq-canary.sh
      TimeoutStartSec=440
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [mkdir, -p, /run/task11-seed]
  - [mount, -o, ro, /dev/vdb, /run/task11-seed]
  - [systemctl, daemon-reload]
  - [systemctl, start, --no-block, task11-nested-prep.service]
