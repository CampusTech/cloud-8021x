# Outer VM has no network workload. Console and read-only media carry control.
# The boot command additionally disables every physical interface before any
# product process is staged. Inner namespaces later use an un-routed bridge.
version: 2
ethernets:
  outer:
    match:
      name: 'en*'
    dhcp4: false
    dhcp6: false
    accept-ra: false
    link-local: []
