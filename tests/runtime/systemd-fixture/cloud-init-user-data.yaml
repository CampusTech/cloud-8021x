#cloud-config
# DEVELOPMENT ONLY. Attach to the owned true-kernel Tart VM as a read-only
# NoCloud seed; never use as product VM metadata. No package/network acquisition.
hostname: task11-outer
manage_etc_hosts: false
ssh_pwauth: false
disable_root: true
package_update: false
package_upgrade: false
bootcmd:
  - |
    set -eu
    for link in /sys/class/net/*; do
      name=${link##*/}
      [ "$name" = lo ] || ip link set dev "$name" down
    done
    sysctl -w net.ipv4.ip_forward=0
    sysctl -w net.ipv6.conf.all.forwarding=0
    sysctl -w net.ipv6.conf.all.disable_ipv6=1
    systemctl mask --now ssh.service ssh.socket apt-daily.service apt-daily-upgrade.service
write_files:
  - path: /etc/cloud8021x-task11-fixture
    owner: root:root
    permissions: '0600'
    content: |
      synthetic-only-v1
  - path: /etc/systemd/journald.conf.d/task11-bounds.conf
    owner: root:root
    permissions: '0644'
    content: |
      [Journal]
      SystemMaxUse=32M
      RuntimeMaxUse=16M
  - path: /usr/local/libexec/task11-outer-preflight
    owner: root:root
    permissions: '0700'
    content: |
      #!/bin/sh
      set -eu
      exec > /dev/hvc0 2>&1
      echo TASK11_OUTER_BEGIN
      . /etc/os-release
      test "$ID:$VERSION_ID" = debian:13
      test "$(cat /proc/1/comm)" = systemd
      uname -a
      case "$(uname -r)" in *orbstack*) exit 1;; esac
      cat /proc/sys/kernel/random/boot_id
      stat -fc %T /sys/fs/cgroup
      cat /proc/1/cgroup
      for kind in pid mnt net uts user cgroup; do readlink "/proc/1/ns/$kind"; done
      test "$(ls /sys/class/net)" = lo
      ip -brief address
      ip -4 route show table all
      ip -6 route show table all
      ss -H -lntup
      dpkg-query -W systemd sudo libc6 libssl3t64 perl-base
      test ! -e /mnt/mac
      test ! -S /var/run/docker.sock
      test -c /dev/loop-control
      command -v systemd-nspawn machinectl nft eapol_test psql || true
      if [ ! -f /var/lib/cloud8021x-task11/platform-canary/first-boot-id ]; then
        echo TASK11_BASE_DPKG_BEGIN
        cat /var/lib/dpkg/status
        echo TASK11_BASE_DPKG_END
      fi
      mkdir -p /var/lib/cloud8021x-task11/platform-canary/loop-canary
      if [ ! -e /var/lib/cloud8021x-task11/platform-canary/loop-canary.ext4 ]; then
        truncate -s 16M /var/lib/cloud8021x-task11/platform-canary/loop-canary.ext4
        mkfs.ext4 -q -F /var/lib/cloud8021x-task11/platform-canary/loop-canary.ext4
      fi
      mount -o loop,nodev,nosuid,noexec /var/lib/cloud8021x-task11/platform-canary/loop-canary.ext4 /var/lib/cloud8021x-task11/platform-canary/loop-canary
      findmnt /var/lib/cloud8021x-task11/platform-canary/loop-canary
      losetup -j /var/lib/cloud8021x-task11/platform-canary/loop-canary.ext4
      if [ -f /var/lib/cloud8021x-task11/platform-canary/first-boot-id ]; then
        test "$(cat /var/lib/cloud8021x-task11/platform-canary/first-boot-id)" != "$(cat /proc/sys/kernel/random/boot_id)"
        test "$(cat /var/lib/cloud8021x-task11/platform-canary/loop-canary/persistent-proof)" = task11-owned-loop
        umount /var/lib/cloud8021x-task11/platform-canary/loop-canary
        echo TASK11_REBOOT_AND_LOOP_PERSISTENCE_PASS
        echo TASK11_OUTER_END
        systemctl --no-block poweroff
      else
        cat /proc/sys/kernel/random/boot_id > /var/lib/cloud8021x-task11/platform-canary/first-boot-id
        printf '%s\n' task11-owned-loop > /var/lib/cloud8021x-task11/platform-canary/loop-canary/persistent-proof
        sync
        umount /var/lib/cloud8021x-task11/platform-canary/loop-canary
        echo TASK11_FIRST_BOOT_REBOOT_REQUESTED
        systemctl --no-block reboot
      fi
  - path: /etc/systemd/system/task11-canary.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Owned development-only zero-NIC platform canary
      After=local-fs.target systemd-tmpfiles-setup-dev.service systemd-udev-trigger.service
      [Service]
      Type=oneshot
      ExecStart=/usr/local/libexec/task11-outer-preflight
      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, task11-canary.service]
  - [systemctl, --no-block, start, task11-canary.service]
