name: go-security

on:
  pull_request: {}
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [webhook, tests/scep]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            webhook/go.sum
            tests/scep/go.sum
      - name: Verify dependencies
        run: go mod download && go mod verify
      - name: Test
        run: go test ./...
      - name: Scan imported packages, including tests
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan package -test ./...
