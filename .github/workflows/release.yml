name: release

# Publication requires an explicit version tag. Main merges and manual runs
# verify/build artifacts without publishing or creating a tag.
on:
  pull_request: {}
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Test actual executable aliases
        run: go test ./cmd/cloud-8021x -count=1
      - name: Build pinned application and byte-identical aliases
        run: mkdir dist && scripts/build-release.sh dist
      - name: Scan both actual release binaries
        run: |
          for arch in amd64 arm64; do
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode binary "dist/cloud-8021x-linux-$arch"
          done
      - name: Verify all mandatory checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: application-release
          path: dist
      - name: Verify downloaded release bytes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish explicitly tagged release with merged PRs and contributors
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "cloud-8021x $RELEASE_TAG" --generate-notes
