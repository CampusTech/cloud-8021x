name: dashboard-sync

on:
  pull_request: {}
  push:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/dashboard/go.mod
          cache-dependency-path: tools/dashboard/go.sum
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false
      - name: Check generated dashboard exports
        working-directory: tools/dashboard
        run: go run . sync --root ../.. --check
      - name: Test export tooling with Terraform
        working-directory: tools/dashboard
        run: go test ./...
      - name: Dashboard regressions
        run: python3 -m unittest discover -s tests -p 'test_dashboard*.py'
